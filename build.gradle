plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")

base {
    archivesName = useLocalizedArchiveName
            ? "[更多动画]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    mavenLocal()
    maven { name = 'Spongepowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'ModdedMITE'; url = uri('https://maven.limingzxc.top/repository/maven-public/') }
}

configurations { fml }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    include implementation("org.joml:joml:1.10.8")

    // EMF owns CEM rendering.  Resolve the compile-time API from Maven so
    // locale-specific archive prefixes never affect project dependencies.
    compileOnly "org.moddedmite:entity_model_features:${project.emf_mite_version}"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add('mappings', fmlMCPMappings())
    mods {
        'notenoughanimations' { sourceSet sourceSets.main }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs '--userProperties', '{}', '--username', name, '--session', 'a.a.a.a', '--width', width, '--height', height
        }
    }
}

processResources {
    inputs.properties(version: project.version, id: project.mod_id, name: project.mod_name)
    filesMatching('fml.mod.json') { expand(inputs.properties) }
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    // Keep the EMF bridge self-contained when Punchy is not installed.
    from {
        configurations.include.findAll { dependency ->
            dependency.name == 'joml-1.10.8.jar'
        }.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = project.maven_group
            artifactId = project.maven_id
            version = project.mod_version
            from(components.java)
        }
    }
}
